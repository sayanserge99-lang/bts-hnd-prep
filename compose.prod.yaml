# Production : docker compose -f compose.prod.yaml --env-file .env.production up -d --build
# Variables : copier .env.production.example en .env.production et le remplir.

name: btshnd-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build:
      context: .
      target: prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      DJANGO_PRODUCTION: "1"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - fichiers:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Traitement des PDF : même image que web, même volume de fichiers.
  worker:
    build:
      context: .
      target: prod
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file: .env.production
    environment:
      DJANGO_PRODUCTION: "1"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - fichiers:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    environment:
      # Même valeur que dans .env.production, avec la barre finale (par défaut : admin/).
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}
    ports:
      - "${PORT_HTTP:-80}:80"
    volumes:
      # Lecture seule : Nginx ne fait qu'envoyer les PDF autorisés par Django.
      - fichiers:/srv/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  fichiers:
