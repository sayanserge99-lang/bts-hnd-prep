{% load i18n %}
{# Zone « Photographier ou choisir un fichier » (maquette) : le champ reste un vrai <input type="file"> #}
{# (clavier, lecteurs d'écran, sans JavaScript) ; la carte entière est son libellé cliquable. #}
<label class="block cursor-pointer rounded-2xl border-2 border-dashed border-gris/60 bg-white px-4 py-8 text-center has-[input:focus-visible]:outline-2 has-[input:focus-visible]:outline-vert hover:border-vert">
  <svg aria-hidden="true" class="mx-auto text-vert" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
  <span class="mt-3 block text-lg font-semibold">{% translate "Photographier ou choisir un fichier" %}</span>
  <span class="mt-1 block text-sm text-gris">{% translate "Photos ou PDF · toutes les pages, bien à plat et lisibles" %}</span>
  <span class="mt-2 block text-sm font-semibold text-vert" data-fichiers-choisis aria-live="polite"
        data-texte-plusieurs="{% translate '%(n)s fichiers choisis' %}"></span>
  <input type="{{ widget.type }}" name="{{ widget.name }}" class="sr-only"{% include "django/forms/widgets/attrs.html" %}>
</label>
