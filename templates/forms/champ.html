{% if field.widget_type == "checkbox" %}
  <div>
    <label class="flex items-start gap-3 text-sm" for="{{ field.auto_id }}">
      {{ field }}<span>{{ field.label }}</span>
    </label>
    {{ field.errors }}
  </div>
{% else %}
  <div class="space-y-1">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<div class="text-xs text-gris" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {{ field.errors }}
  </div>
{% endif %}
