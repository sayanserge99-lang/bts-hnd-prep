# Environnement de développement : docker compose up -d
# Production : compose.prod.yaml (voir deploy/DEPLOIEMENT.md).

# Réglages communs au serveur web et au worker Celery.
x-django-env: &django-env
  DJANGO_DEBUG: "1"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_DB: btshnd
  POSTGRES_USER: btshnd
  POSTGRES_PASSWORD: btshnd
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  # Pour essayer la connexion Google en local : identifiants de test (voir deploy/DEPLOIEMENT.md, section 7).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # Essayer le parcours de paiement avec l'agrégateur simulé : PAIEMENT_ESSAI=1 dans le fichier .env.
  PAIEMENT_ESSAI: ${PAIEMENT_ESSAI:-0}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: btshnd
      POSTGRES_USER: btshnd
      POSTGRES_PASSWORD: btshnd
    # Ouvert sur la machine pour lancer pytest depuis le venv.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btshnd"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache partagé (blocage des connexions) et file des tâches Celery.
  redis:
    image: redis:7-alpine

  web:
    build:
      context: .
      target: dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment: *django-env
    ports:
      - "8000:8000"
    # Le code est monté dans le conteneur : une modification recharge le serveur.
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Traitement des PDF (OCR, compression, texte). Ne se recharge pas tout seul :
  # après une modification de sujets/tasks.py ou traitement_pdf.py, `docker compose restart worker`.
  worker:
    build:
      context: .
      target: dev
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *django-env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Recompile static/css/app.css toutes les 2 s : les fichiers Windows montés dans Docker
  # n'envoient pas de notification de changement, donc --watch ne verrait rien.
  tailwind:
    build:
      context: .
      target: dev
    command: sh -c "while true; do tailwindcss -i assets/css/app.css -o static/css/app.css 2>/dev/null; sleep 2; done"
    volumes:
      - .:/app

volumes:
  postgres_data:
