name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Chaque lundi, même sans modification : une faille découverte entre-temps dans une dépendance est signalée.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: btshnd
          POSTGRES_USER: btshnd
          POSTGRES_PASSWORD: btshnd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U btshnd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-uniquement
      DJANGO_DEBUG: "0"
      POSTGRES_DB: btshnd
      POSTGRES_USER: btshnd
      POSTGRES_PASSWORD: btshnd
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      # Même version que l'image de production prévue (Django 5.2 supporte officiellement 3.13).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Sans cela, chaque installation reconstruit l'index des pages de manuel (plusieurs minutes).
      - name: Désactiver l'index des pages de manuel
        run: sudo rm -f /var/lib/man-db/auto-update

      # Mêmes outils que l'image Docker : les tests d'OCR et de compression tournent aussi ici.
      # Paquets gardés en cache d'un passage à l'autre : apt sur les machines GitHub prenait de 10 s à 12 min.
      - name: Installer les outils système
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: gettext tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng ghostscript
          version: "1"
          execute_install_scripts: true

      - name: Vérifier les outils système
        run: tesseract --list-langs && gs --version && msgfmt --version | head -1

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Failles connues (base PyPI / OSV) dans les bibliothèques utilisées : la CI échoue s'il y en a.
      - name: Rechercher les failles connues des dépendances
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Vérifier qu'aucune migration ne manque
        run: python manage.py makemigrations --check --dry-run

      # Réglages de production (HTTPS activé) : tout avertissement de sécurité fait échouer.
      - name: Contrôle de sécurité de la production
        run: |
          export DJANGO_PRODUCTION=1 DJANGO_HTTPS=1 DJANGO_ALLOWED_HOSTS=bts-hnd-prep.example.com DJANGO_ADMIN_URL=gestion-ci/
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          # Une production réglée a un fournisseur d'e-mails et un destinataire des alertes (accounts.W002, W003).
          export EMAIL_HOST=smtp.example.com DJANGO_ADMINS="Equipe <equipe@example.com>"
          python manage.py check --deploy --fail-level WARNING

      # Extrait les textes avant les tests : un texte affiché sans traduction anglaise
      # apparaît alors vide dans le .po et fait échouer test_tous_les_textes_ont_une_traduction_anglaise.
      - name: Extraire les textes à traduire
        run: |
          python manage.py makemessages -l en --ignore=.venv --ignore=static --ignore=staticfiles --ignore=media --no-obsolete
          # Un .po mal formé ne se compile pas (et l'anglais ne s'affiche plus) : on le refuse ici.
          msgfmt --check-format -o /dev/null locale/en/LC_MESSAGES/django.po

      # jsdom pour les essais du JavaScript de l'examen blanc (entrainement/tests/test_examen_js.py).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer jsdom
        run: npm ci --prefix tests_js

      # -rs affiche les tests sautés : les tests d'OCR et du JavaScript ne doivent pas l'être ici.
      - name: Lancer les tests
        run: pytest -v -rs
