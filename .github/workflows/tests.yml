name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: btshnd
          POSTGRES_USER: btshnd
          POSTGRES_PASSWORD: btshnd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U btshnd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-uniquement
      DJANGO_DEBUG: "0"
      POSTGRES_DB: btshnd
      POSTGRES_USER: btshnd
      POSTGRES_PASSWORD: btshnd
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      # Même version que l'image de production prévue (Django 5.2 supporte officiellement 3.13).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Vérifier qu'aucune migration ne manque
        run: python manage.py makemigrations --check --dry-run

      # Réglages de production (HTTPS activé) : tout avertissement de sécurité fait échouer.
      - name: Contrôle de sécurité de la production
        run: |
          export DJANGO_PRODUCTION=1 DJANGO_HTTPS=1 DJANGO_ALLOWED_HOSTS=bts-hnd-prep.example.com
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --fail-level WARNING

      # Extrait les textes avant les tests : un texte affiché sans traduction anglaise
      # apparaît alors vide dans le .po et fait échouer test_tous_les_textes_ont_une_traduction_anglaise.
      - name: Extraire les textes à traduire
        run: |
          sudo apt-get install -y --no-install-recommends gettext
          python manage.py makemessages -l en --ignore=.venv --ignore=static --ignore=staticfiles --ignore=media --no-obsolete

      - name: Lancer les tests
        run: pytest -v
