# Nginx devant Gunicorn (compose.prod.yaml).
# HTTPS : sur le VPS, ajouter le certificat (Let's Encrypt) et un bloc « listen 443 ssl »,
# puis passer DJANGO_HTTPS=1 dans .env.production.

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Envoi de sujets par les contributeurs (V3) : photos ou PDF.
    client_max_body_size 20m;

    # CDC 4 : pages légères sur une connexion 3G.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /static/ {
        alias /srv/static/;
        # Noms versionnés par ManifestStaticFilesStorage : le cache peut être long.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Uniquement sur ordre de Django (en-tête X-Accel-Redirect de la vue sujets:pdf),
    # après vérification que le sujet est publié. Jamais accessible depuis l'extérieur.
    location /fichiers-proteges/ {
        internal;
        alias /srv/media/;
    }

    # Pas de « location /media/ » : un PDF ne doit jamais être lisible par son chemin.

    # Import de sujets en lot (admin) : un ZIP de photos peut être gros.
    location /admin/sujets/sujet/importer/ {
        client_max_body_size 200m;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        # Écrase toute valeur envoyée par le visiteur : Django peut s'y fier (communaute.views.adresse_ip).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
